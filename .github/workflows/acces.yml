# Invite automatiquement un élève sur le dépôt privé adcloner-eleves quand il ouvre une demande avec le bon code d'accès.
# Secrets du dépôt : INVITE_TOKEN (jeton GitHub de Jaouad : Administration en écriture sur adcloner-eleves et adcloner-guide,
# Issues en écriture sur adcloner-guide) et CODE_ACCES (le code donné dans la formation).
name: Accès AdCloner
on:
  issues:
    types: [opened]
permissions:
  issues: write
jobs:
  acces:
    if: startsWith(github.event.issue.title, 'Demande d')
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier le code et inviter
        env:
          GH_TOKEN: ${{ secrets.INVITE_TOKEN }}
          CODE: ${{ secrets.CODE_ACCES }}
          CORPS: ${{ github.event.issue.body }}
          ELEVE: ${{ github.event.issue.user.login }}
          NUMERO: ${{ github.event.issue.number }}
          NOEUD: ${{ github.event.issue.node_id }}
          DEPOT: ${{ github.repository }}
        run: |
          if [ -n "$CODE" ] && printf '%s' "$CORPS" | grep -qF -- "$CODE"; then
            if gh api -X PUT "repos/contactsyriusmedia-create/adcloner-eleves/collaborators/$ELEVE" -f permission=pull >/dev/null; then
              echo "Invitation envoyée à $ELEVE"; message="Invitation envoyée ✅ Regarde tes e-mails."
            else
              echo "ÉCHEC de l'invitation pour $ELEVE"; message="L'invitation a échoué ❌ Préviens ton formateur."
            fi
            # dans tous les cas, supprimer la demande pour que le code ne reste pas visible (sinon : retirer le code et fermer)
            if ! gh api graphql -f query='mutation($id:ID!){deleteIssue(input:{issueId:$id}){clientMutationId}}' -f id="$NOEUD" >/dev/null; then
              echo "Suppression impossible : code retiré de la demande"
              gh issue edit "$NUMERO" -R "$DEPOT" --body "(code retiré)"
              gh issue close "$NUMERO" -R "$DEPOT" -c "$message"
            fi
          else
            gh issue close "$NUMERO" -R "$DEPOT" -c "Code d'accès incorrect ❌ Vérifie le code donné dans ta formation, puis refais la demande depuis le tuto."
            echo "Code incorrect pour $ELEVE"
          fi
